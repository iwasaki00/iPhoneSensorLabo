<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>iPhone Sensor Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">iPhone Sensor Lab</p>
      <h1>iPhone センサー実験室</h1>
      <p class="lead">
        iPhone Safari でカメラ機能と各種センサー機能をカテゴリ別に確認するための入口ページです。
      </p>
    </header>

    <section class="menu-home">
      <a class="menu-card" href="camera.html">
        <p class="card-kicker">Camera Lab</p>
        <h2>カメラ実験</h2>
        <p class="card-copy">カメラ映像表示と手指認識実験をまとめています。</p>
        <ul class="link-list">
          <li>カメラ映像表示</li>
          <li>手指認識実験</li>
        </ul>
      </a>

      <a class="menu-card" href="sensor.html">
        <p class="card-kicker">Sensor Lab</p>
        <h2>センサー実験</h2>
        <p class="card-copy">傾き加速度、GPS、画面の向き、端末情報を確認できます。</p>
        <ul class="link-list">
          <li>傾き加速度</li>
          <li>GPS</li>
          <li>画面の向き</li>
          <li>端末情報</li>
        </ul>
      </a>
    </section>
  </main>

</html>
