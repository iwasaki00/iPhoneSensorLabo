<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10191e"><title>応用デモ — Camera Vision Lab</title></head>
<body><main>
<header><a href="index.html">カメラ認識実験室へ</a><span>v1.0.0</span></header>
<section id="demo-menu"><h1>応用デモ</h1><p>身近な物や写真で、認識技術の使い道を試せます。</p><div id="demo-list"></div><p class="muted">サンプルはカメラ許可・印刷不要。解析はこの端末内で実行します。</p></section>
<section id="demo-app" hidden><h1 id="demo-title"></h1><p id="demo-intro"></p>
<details id="demo-help"><summary>詳しい使い方</summary><div id="demo-instructions"></div></details>
<p id="demo-step" role="status"></p><div class="picture"><canvas id="demo-canvas" width="640" height="420" aria-label="入力画像と認識結果"></canvas></div>
<video id="demo-video" playsinline muted hidden></video>
<div id="demo-controls"></div><p id="demo-result" role="status"></p><div id="demo-comparison"></div>
<details><summary>処理・入力の情報</summary><pre id="demo-metrics">未解析</pre></details>
<nav class="demo-nav"><button id="demo-reset">やり直す</button><button id="demo-home">応用デモに戻る</button></nav>
</section><p class="muted">画像・読み取った内容は外部送信・自動保存しません。モデル等は必要なデモで同じサイトから読み込みます。</p>
</main><script type="module" src="/src/demos/app.ts"></script></body></html>
